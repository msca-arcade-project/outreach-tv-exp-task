<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ARCADE outreach task &ndash; Lean</title>
<link rel="stylesheet" href="../shared/style.css?v=39" />
<link rel="stylesheet" href="style.css?v=39" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
  <div id="start-screen">
    <h1>Cible&nbsp;: voyelle &ndash; appuyez sur la flèche droite.<br />Non-cible&nbsp;: consonne &ndash; appuyez sur la flèche gauche.</h1>
    <div>
      <button id="start-distracted">Démarrer (avec distraction)</button>
      <button id="start-undistracted">Démarrer (sans distraction)</button>
    </div>
    <button id="reset-comparison-btn" class="secondary-btn">Réinitialiser la comparaison</button>
  </div>

  <div id="task-screen" style="display: none;">
    <div class="bg-panel">
      <div id="progress-panel">
        <div class="label" id="progress-label">CORRECT</div>
        <div class="value" id="progress-value">0 / 50</div>
        <div id="progress-bar-track"><div id="progress-bar-fill"></div></div>
      </div>
      <div id="stream-canvas-holder"></div>
      <div id="key-hints">
        <span class="non-target">&larr; CONSONNE</span>
        <span class="target">VOYELLE &rarr;</span>
      </div>
    </div>
    <div id="distractor-layer"></div>
  </div>

  <div id="results-screen"></div>

  <script src="../shared/strings.js?v=39"></script>
  <script src="../shared/task-engine.js?v=39"></script>
  <script src="../shared/progress-readout.js?v=39"></script>
  <script src="../shared/results-screen.js?v=39"></script>
  <script src="../shared/audio.js?v=39"></script>
  <script src="../shared/sketch-core.js?v=39"></script>
  <script src="../shared/autoplay.js?v=39"></script>
  <script src="../shared/notifications.js?v=39"></script>
  <script src="distractor.js?v=39"></script>
  <script>
    // Named here, not left as buried defaults inside task-engine.js, so the
    // scroll rate (and the other stream parameters) can be tuned per page
    // without reading the engine's source.
    const ENGINE_OPTIONS = {
      scrollSpeedPxPerSec: 120, // vertical scroll speed of the stream
      itemSpacingPx: 140,       // vertical gap between consecutive items
      totalItems: 50,           // ~60s run at this scroll rate (TV feedback asked for ~1min)
      targetProbability: 0.3,
    };

    const params = new URLSearchParams(window.location.search);

    // ?trials=N overrides the trial count for both normal play and autoplay
    // (autoplay's own default of 20 included) without editing ENGINE_OPTIONS.
    const trialsParam = parseInt(params.get('trials'), 10);
    const trialsOverride = Number.isInteger(trialsParam) && trialsParam > 0 ? trialsParam : null;

    const soundEngine = new SoundEngine();

    function begin(condition, { engineOptions = ENGINE_OPTIONS, onEngineReady } = {}) {
      document.getElementById('start-screen').style.display = 'none';
      // 'flex', not 'block' -- #task-screen's CSS display:flex is what
      // centers .bg-panel; an inline style of 'block' would override that
      // stylesheet rule entirely and silently drop the centering.
      document.getElementById('task-screen').style.display = 'flex';
      const progressReadout = new ProgressReadout({
        labelEl: document.getElementById('progress-label'),
        valueEl: document.getElementById('progress-value'),
        barFillEl: document.getElementById('progress-bar-fill'),
      });
      startStreamTask({
        canvasHolderId: 'stream-canvas-holder',
        condition,
        progressReadout,
        engineOptions,
        onEngineReady,
        soundEngine,
        startDistractor: startLeanDistractor,
        stopDistractor: stopLeanDistractor,
        onFinish: (engine) => {
          document.getElementById('task-screen').style.display = 'none';
          renderResultsScreen(document.getElementById('results-screen'), condition, engine);
        },
      });
    }
    document.getElementById('start-distracted').addEventListener('click', () => {
      soundEngine.unlock();
      begin('distracted', {
        engineOptions: trialsOverride ? { ...ENGINE_OPTIONS, totalItems: trialsOverride } : ENGINE_OPTIONS,
      });
    });
    document.getElementById('start-undistracted').addEventListener('click', () => {
      soundEngine.unlock();
      begin('undistracted', {
        engineOptions: trialsOverride ? { ...ENGINE_OPTIONS, totalItems: trialsOverride } : ENGINE_OPTIONS,
      });
    });

    // sessionStorage (where results-screen.js keeps a finished run for the
    // side-by-side comparison) survives a page reload, so a stale run could
    // otherwise linger and pair up with a fresh one with no way to clear it.
    document.getElementById('reset-comparison-btn').addEventListener('click', (e) => {
      clearStoredResults();
      const original = e.target.textContent;
      e.target.textContent = 'Comparaison réinitialisée';
      setTimeout(() => { e.target.textContent = original; }, 1500);
    });

    // Dev-only shortcut: ?debugResults=1 jumps straight to the two-column
    // comparison view with fixed sample numbers, so the results screen can
    // be checked without playing through the task first. No effect unless
    // that query param is present.
    if (params.has('debugResults')) {
      document.getElementById('start-screen').style.display = 'none';
      saveRunResult('undistracted', { correctCount: 39, incorrectCount: 1, missedCount: 0, totalItems: 40, meanRtMs: 275 });
      renderResultsScreen(
        document.getElementById('results-screen'),
        'distracted',
        { correctCount: 35, incorrectCount: 3, missedCount: 2, totalItems: 40, meanRtMs: 900 }
      );
    }

    // Dev-only shortcut: ?autoplay=distracted or ?autoplay=undistracted runs
    // the task hands-free with correct, human-plausible-delay responses, at
    // a short 20 items -- for recording a clean, repeatable demo video
    // instead of relying on live keypresses. No effect unless the param is
    // present and set to one of those two values.
    const autoplayCondition = params.get('autoplay');
    if (autoplayCondition === 'distracted' || autoplayCondition === 'undistracted') {
      begin(autoplayCondition, {
        engineOptions: { ...ENGINE_OPTIONS, totalItems: trialsOverride ?? 20 },
        onEngineReady: (engine) => startAutoResponder(engine),
      });
    }
  </script>
</body>
</html>
