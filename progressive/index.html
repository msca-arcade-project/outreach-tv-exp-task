<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ARCADE outreach task &ndash; Progressive</title>
<link rel="stylesheet" href="../shared/style.css?v=40" />
<link rel="stylesheet" href="../showcase/style.css?v=40" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
  <div id="start-screen">
    <h1>Cible&nbsp;: voyelle &ndash; appuyez sur la flèche droite.<br />Non-cible&nbsp;: consonne &ndash; appuyez sur la flèche gauche.<br />Aucune distraction au début&nbsp;; des notifications apparaîtront progressivement.</h1>
    <div>
      <button id="start-btn">Démarrer</button>
    </div>
  </div>

  <div id="task-screen" style="display: none;">
    <div class="bg-panel">
      <div id="progress-panel">
        <div class="label" id="progress-label">CORRECT</div>
        <div class="value" id="progress-value">0 / 50</div>
        <div id="progress-bar-track"><div id="progress-bar-fill"></div></div>
      </div>
      <div id="stream-canvas-holder"></div>
      <div id="key-hints">
        <span class="non-target">&larr; CONSONNE</span>
        <span class="target">VOYELLE &rarr;</span>
      </div>
    </div>
    <div id="distractor-layer"></div>
  </div>

  <div id="results-screen"></div>

  <script src="../shared/strings.js?v=40"></script>
  <script src="../shared/task-engine.js?v=40"></script>
  <script src="../shared/progress-readout.js?v=40"></script>
  <script src="../shared/results-screen.js?v=40"></script>
  <script src="../shared/audio.js?v=40"></script>
  <script src="../shared/sketch-core.js?v=40"></script>
  <script src="../shared/autoplay.js?v=40"></script>
  <script src="../shared/notifications.js?v=40"></script>
  <script src="distractor.js?v=40"></script>
  <script>
    // Same rationale as lean/showcase: named here so the stream parameters
    // can be tuned per page without reading the engine's source.
    const ENGINE_OPTIONS = {
      scrollSpeedPxPerSec: 120,
      itemSpacingPx: 140,
      totalItems: 50,
      targetProbability: 0.3,
    };

    const params = new URLSearchParams(window.location.search);

    // ?trials=N overrides the trial count, same as lean/showcase.
    const trialsParam = parseInt(params.get('trials'), 10);
    const trialsOverride = Number.isInteger(trialsParam) && trialsParam > 0 ? trialsParam : null;

    // ?plot=point switches the end-screen error/time chart to filled
    // circles instead of bars; anything else (including no param) falls
    // back to the barchart default per the TV contact's own "start with
    // barchart" note. ?plot=no hides the chart entirely -- the TV
    // feedback never asked for this chart in the first place, so it stays
    // shown by default and is only dropped on request, same as the pie.
    const plotType = params.get('plot') === 'point' ? 'point' : 'barchart';
    const showChart = params.get('plot') !== 'no';

    // ?piechart=yes shows the pie row on the results screen (TEMPS DE
    // RÉPONSE always shows regardless -- see renderProgressiveResultsScreen);
    // anything else, including no param, defaults to hiding it.
    const showPieChart = params.get('piechart') === 'yes';

    // ?maxrate=N overrides the plateau distraction rate (notifications per
    // second, reached from 90% trial progress onward); anything absent,
    // non-numeric or <= 0 falls back to startProgressiveNotifCycle's own
    // default (shared/notifications.js), currently 1.5.
    const maxRateParam = parseFloat(params.get('maxrate'));
    const maxRateOverride = Number.isFinite(maxRateParam) && maxRateParam > 0 ? maxRateParam : undefined;

    // ?displayms=N overrides how long a notification is held before it
    // starts to fade (milliseconds); anything absent, non-numeric or <= 0
    // falls back to startProgressiveNotifCycle's own default
    // (shared/notifications.js's NOTIF_DISPLAY_MS), currently 4000.
    const displayMsParam = parseFloat(params.get('displayms'));
    const displayMsOverride = Number.isFinite(displayMsParam) && displayMsParam > 0 ? displayMsParam : undefined;

    const soundEngine = new SoundEngine();

    // No 'distracted'/'undistracted' choice here -- a progressive run is a
    // single condition where the distraction *rate* itself ramps up over
    // the second half (see startProgressiveNotifCycle in notifications.js),
    // so there's nothing to pick and only one link/button to ever use.
    function begin(engineOptions = ENGINE_OPTIONS, onEngineReady) {
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('task-screen').style.display = 'flex';
      const progressReadout = new ProgressReadout({
        labelEl: document.getElementById('progress-label'),
        valueEl: document.getElementById('progress-value'),
        barFillEl: document.getElementById('progress-bar-fill'),
      });
      startStreamTask({
        canvasHolderId: 'stream-canvas-holder',
        condition: 'distracted', // the ramp (not this flag) gates early-run silence -- see sketch-core.js
        progressReadout,
        engineOptions,
        onEngineReady,
        soundEngine,
        startDistractor: startProgressiveDistractor,
        stopDistractor: stopProgressiveDistractor,
        distractorOptions: { maxRatePerSec: maxRateOverride, displayMs: displayMsOverride },
        onFinish: (engine) => {
          document.getElementById('task-screen').style.display = 'none';
          renderProgressiveResultsScreen(document.getElementById('results-screen'), engine, plotType, showPieChart, showChart);
        },
      });
    }
    document.getElementById('start-btn').addEventListener('click', () => {
      soundEngine.unlock();
      begin(trialsOverride ? { ...ENGINE_OPTIONS, totalItems: trialsOverride } : ENGINE_OPTIONS);
    });

    // Dev-only shortcut: ?debugResults=1 jumps straight to the results
    // screen with fixed sample numbers, so it can be checked without
    // playing through the task first. No effect unless the param is present.
    if (params.has('debugResults')) {
      document.getElementById('start-screen').style.display = 'none';
      const sampleHistory = [];
      for (let i = 0; i < 40; i++) {
        sampleHistory.push({ id: i, outcome: i < 20 ? 'correct' : (i % 3 === 0 ? 'incorrect' : 'correct') });
      }
      renderProgressiveResultsScreen(
        document.getElementById('results-screen'),
        {
          correctCount: 33, incorrectCount: 5, missedCount: 2, totalItems: 40, meanRtMs: 420,
          scoredHistory: sampleHistory,
        },
        plotType,
        showPieChart,
        showChart
      );
    }

    // Dev-only shortcut: ?autoplay=1 runs the task hands-free with correct,
    // human-plausible-delay responses, at a short 20 items -- for recording
    // a clean, repeatable demo video instead of relying on live keypresses.
    if (params.get('autoplay') === '1') {
      begin(
        { ...ENGINE_OPTIONS, totalItems: trialsOverride ?? 20 },
        (engine) => startAutoResponder(engine)
      );
    }
  </script>
</body>
</html>
